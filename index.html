<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#315741">
  <title>오늘 뭐먹지? · 제철 식탁</title>
  <style>
    :root{--ink:#263d30;--green:#315741;--muted:#7a8078;--paper:#f8f8f2;--line:#e2e6db}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;word-break:keep-all}button,select{font:inherit}button,select{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #b89148;outline-offset:4px}
    header{max-width:1200px;margin:auto;padding:27px 36px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:800;font-size:21px;letter-spacing:-1px;display:flex;align-items:center;gap:10px}.brand-icon{background:var(--green);color:white;border-radius:12px;padding:7px 10px;font-size:20px}.header-note{font-size:12px;color:var(--muted);letter-spacing:1px}main{max-width:1200px;margin:auto;padding:40px 36px 70px}.hero{position:relative;overflow:hidden;min-height:285px;padding:40px 44px;background:#eaf0df;border-radius:25px;display:flex;align-items:center;justify-content:space-between;gap:25px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:2.5px;color:#61764b;margin:0 0 18px}h1{font-size:clamp(32px,4vw,48px);letter-spacing:-2px;line-height:1.3;margin:0 0 15px}.intro{font-size:14px;color:#63715e;line-height:1.8;margin:0}.hero-art{width:240px;height:210px;flex-shrink:0;transform:rotate(-7deg)}.month-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:32px 0 24px}.month-label{display:flex;align-items:center;gap:14px;font-size:14px;font-weight:600}select{border:1px solid #d3dccb;background:#fff;color:var(--ink);padding:12px 42px 12px 18px;border-radius:12px;font-weight:700}.hint{color:var(--muted);font-size:12px}.ingredients-panel{background:white;border:1px solid var(--line);padding:24px 26px;border-radius:18px}.section-label{font-size:15px;margin:0 0 17px;display:flex;align-items:center;gap:9px}.dot{width:7px;height:7px;border-radius:50%;background:#a1b67d}.ingredients{display:flex;flex-wrap:wrap;gap:9px}.ingredient{border:1px solid var(--line);background:#fafbf7;border-radius:30px;padding:11px 21px;font-size:14px;color:#687261;transition:background .15s,color .15s}.ingredient:hover{background:#eef2e7}.ingredient[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}.results-header{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:39px 0 20px}h2{font-size:23px;letter-spacing:-.7px;margin:0}.results-subtitle{margin:9px 0 0;color:var(--muted);font-size:13px}.count{font-size:12px;white-space:nowrap;color:var(--muted)}.count strong{color:var(--green)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.photo{aspect-ratio:1.5;background:#edf0e6;position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}.card:hover img{transform:scale(1.035)}.photo.fallback{display:grid;place-items:center;color:#748367;font-size:14px}.card-body{padding:20px}.category{display:inline-block;font-size:11px;background:#edf2e7;color:#59704a;border-radius:6px;padding:5px 8px;margin-bottom:10px}.card h3{font-size:18px;letter-spacing:-.5px;margin:0;line-height:1.5}.card-meta{border-top:1px solid #f0f1eb;margin-top:17px;padding-top:13px;display:flex;gap:14px;font-size:11px;color:#858b80}.empty{grid-column:1/-1;text-align:center;border:1px dashed #ced8c4;border-radius:18px;padding:55px 20px;background:#f0f3e9;color:#76836d;line-height:1.8;font-size:14px}.empty strong{display:block;color:var(--green);font-size:18px;margin-bottom:9px}.status{margin:0;color:var(--muted);font-size:13px;line-height:1.8}.retry{margin-top:15px;background:var(--green);color:white;border:0;border-radius:8px;padding:10px 18px}footer{max-width:1128px;margin:auto;border-top:1px solid var(--line);padding:24px 0 32px;display:flex;justify-content:space-between;gap:16px;color:#8a9085;font-size:11px}.footer-brand{font-weight:700;color:#617356}
    @media(min-width:1000px){.hero-art{margin-right:30px}}@media(max-width:700px){header{padding:21px 20px}.header-note{display:none}main{padding:24px 20px 45px}.hero{padding:30px 26px;min-height:250px}.hero-art{position:absolute;right:-65px;bottom:-25px;width:185px;opacity:.22}.hero-copy{z-index:1}.intro{max-width:260px;font-size:13px}.month-bar{align-items:start}.hint{max-width:120px;text-align:right;line-height:1.6}.month-label{gap:9px;font-size:12px}.ingredients-panel{padding:22px 20px}.ingredient{padding:10px 17px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card-body{padding:15px}.card h3{font-size:16px}.card-meta{flex-wrap:wrap;gap:6px}footer{margin:0 20px;flex-direction:column}h2{font-size:21px}}@media(max-width:400px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><div class="brand"><span class="brand-icon" aria-hidden="true">♧</span>오늘 뭐먹지?</div><span class="header-note">계절을 담은 한 끼, 나를 위한 식탁</span></header>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy"><p class="eyebrow">SEASONAL TABLE</p><h1 id="hero-title">제철의 맛으로,<br>오늘을 맛있게.</h1><p class="intro">지금 가장 맛있는 재료를 골라보세요.<br>계절에 어울리는 한 끼를 함께 찾아드릴게요.</p></div>
      <svg class="hero-art" viewBox="0 0 260 230" fill="none" aria-hidden="true"><ellipse cx="133" cy="126" rx="105" ry="98" fill="#dbe6c9"/><circle cx="133" cy="119" r="86" fill="#fdfdf5"/><circle cx="133" cy="119" r="69" stroke="#e4e8d8" stroke-width="2"/><path d="M70 117C42 91 71 65 90 85C95 47 125 60 120 85C154 61 166 94 144 110C169 129 140 148 119 134C117 162 90 167 85 141C59 151 44 127 70 117Z" fill="#6d8d4d"/><path d="M86 143L120 89M83 113L105 113M104 100L103 87" stroke="#a4bc77" stroke-width="3" stroke-linecap="round"/><path d="M127 126C143 97 182 101 190 130C198 163 171 181 152 176C129 174 116 151 127 126Z" fill="#dba057"/><path d="M155 111C159 99 164 96 174 98" stroke="#70844b" stroke-width="8" stroke-linecap="round"/><path d="M151 121C139 140 141 156 151 168M164 121C177 140 174 157 164 170" stroke="#c58a44" stroke-width="2"/><circle cx="98" cy="162" r="18" fill="#ac6546"/><circle cx="98" cy="162" r="10" fill="#f2d5a7"/><circle cx="98" cy="162" r="3" fill="#ac6546"/><path d="M205 55L220 40M211 67L232 64M197 45L200 26" stroke="#a7b785" stroke-width="3" stroke-linecap="round"/></svg>
    </section>
    <div class="month-bar"><label class="month-label" for="month">어느 계절을 맛볼까요?<select id="month" aria-label="월 선택"></select></label><span class="hint">매달 달라지는 제철의 즐거움</span></div>
    <section class="ingredients-panel" aria-labelledby="ingredients-title"><h2 class="section-label" id="ingredients-title"><span class="dot" aria-hidden="true"></span><span id="month-title">이달의 제철 재료</span></h2><div class="ingredients" id="ingredients"><p class="status">제철 재료를 불러오는 중이에요…</p></div></section>
    <section aria-labelledby="results-title"><div class="results-header"><div><h2 id="results-title">오늘의 제철 메뉴</h2><p class="results-subtitle" id="results-subtitle">마음에 드는 재료를 선택해 주세요.</p></div><span class="count" id="count"></span></div><div class="grid" id="recipes" aria-live="polite" aria-busy="true"></div></section>
  </main>
  <footer><span class="footer-brand">오늘 뭐먹지? · SEASONAL TABLE</span><span>제철 재료로 채우는 작고 건강한 일상</span></footer>
  <script>
    const monthSelect = document.querySelector('#month');
    const ingredients = document.querySelector('#ingredients');
    const recipes = document.querySelector('#recipes');
    const subtitle = document.querySelector('#results-subtitle');
    const count = document.querySelector('#count');
    let data = { seasonal: [], recipes: [] };
    let selectedIngredient = null;
    let loaded = false;
    for (let month = 1; month <= 12; month++) {
      const option = document.createElement('option');
      option.value = month;
      option.textContent = `${month}월`;
      monthSelect.append(option);
    }
    monthSelect.value = new Date().getMonth() + 1;
    function emptyMessage(title, description) {
      const box = document.createElement('div');
      box.className = 'empty';
      const heading = document.createElement('strong');
      heading.textContent = title;
      box.append(heading, document.createTextNode(description));
      recipes.replaceChildren(box);
    }
    function renderRecipes() {
      const month = Number(monthSelect.value);
      const matches = selectedIngredient ? data.recipes.filter(recipe =>
        Array.isArray(recipe.seasonal) && recipe.seasonal.includes(selectedIngredient) &&
        Array.isArray(recipe.months) && recipe.months.includes(month)
      ) : [];
      count.replaceChildren();
      const total = document.createElement('strong');
      total.textContent = matches.length;
      count.append('총 ', total, '개의 메뉴');
      subtitle.textContent = selectedIngredient ? `${month}월의 ${selectedIngredient}(으)로 차리는 맛있는 한 끼` : '마음에 드는 재료를 선택해 주세요.';
      if (!matches.length) {
        emptyMessage(selectedIngredient ? '아직 준비된 메뉴가 없어요' : '어떤 재료가 끌리세요?', selectedIngredient ? '이 재료와 선택한 월에 맞는 레시피가 없어요. 다른 재료나 월을 선택해 보세요.' : '위의 제철 재료를 누르면 어울리는 메뉴를 보여드릴게요.');
        return;
      }
      recipes.replaceChildren(...matches.map(recipe => {
        const card = document.createElement('article');
        card.className = 'card';
        const photo = document.createElement('div');
        photo.className = 'photo';
        const fallback = () => { photo.classList.add('fallback'); photo.textContent = '사진을 준비하고 있어요'; };
        let url;
        try { url = new URL(recipe.image, location.href); } catch {}
        if (recipe.image && url && ['https:', 'http:'].includes(url.protocol)) {
          const img = document.createElement('img');
          img.alt = recipe.name || '메뉴 사진';
          img.loading = 'lazy';
          img.addEventListener('error', fallback, { once: true });
          img.src = url.href;
          photo.append(img);
        } else fallback();
        const body = document.createElement('div');
        body.className = 'card-body';
        const category = document.createElement('span');
        category.className = 'category';
        category.textContent = recipe.category || '요리';
        const title = document.createElement('h3');
        title.textContent = recipe.name || '이름 없는 메뉴';
        body.append(category, title);
        const meta = document.createElement('div');
        meta.className = 'card-meta';
        for (const [value, label] of [[recipe.kcal, 'kcal'], [recipe.sodium, 'mg 나트륨']]) {
          if (value !== null && value !== undefined && value !== '') {
            const item = document.createElement('span');
            item.textContent = `${value} ${label}`;
            meta.append(item);
          }
        }
        if (meta.childElementCount) body.append(meta);
        card.append(photo, body);
        return card;
      }));
    }
    function renderMonth() {
      if (!loaded) return;
      const month = Number(monthSelect.value);
      document.querySelector('#month-title').textContent = `${month}월, 지금 맛있는 재료`;
      const names = [...new Set(data.seasonal.filter(item => item.month === month && typeof item.name === 'string').map(item => item.name))];
      selectedIngredient = null;
      ingredients.replaceChildren(...names.map(name => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'ingredient';
        button.textContent = name;
        button.setAttribute('aria-pressed', 'false');
        button.addEventListener('click', () => {
          selectedIngredient = name;
          for (const sibling of ingredients.querySelectorAll('button')) sibling.setAttribute('aria-pressed', String(sibling === button));
          renderRecipes();
        });
        return button;
      }));
      if (!names.length) {
        const message = document.createElement('p');
        message.className = 'status';
        message.textContent = '이달에 등록된 제철 재료가 없어요. 다른 월을 선택해 보세요.';
        ingredients.append(message);
      }
      renderRecipes();
    }
    monthSelect.addEventListener('change', renderMonth);
    async function loadData() {
      recipes.setAttribute('aria-busy', 'true');
      try {
        const response = await fetch('./menu.json');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const result = await response.json();
        if (!result || !Array.isArray(result.seasonal) || !Array.isArray(result.recipes)) throw new Error('Invalid menu data');
        data = result;
        loaded = true;
        renderMonth();
      } catch (error) {
        ingredients.textContent = '재료를 불러오지 못했어요.';
        count.textContent = '';
        emptyMessage('메뉴 데이터를 불러올 수 없어요', location.protocol === 'file:' ? 'fetch를 사용하려면 로컬 웹 서버로 실행해 주세요. 같은 폴더에 menu.json이 있는지도 확인해 주세요.' : '같은 폴더의 menu.json과 데이터 형식을 확인한 뒤 다시 시도해 주세요.');
        const retry = document.createElement('button');
        retry.type = 'button';
        retry.className = 'retry';
        retry.textContent = '다시 불러오기';
        retry.addEventListener('click', loadData);
        recipes.firstElementChild.append(document.createElement('br'), retry);
      } finally { recipes.setAttribute('aria-busy', 'false'); }
    }
    loadData();
  </script>
</body>
</html>
